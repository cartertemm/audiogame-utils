<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Settings demo - audiogame-utils</title>
	<style>
		body {
			margin: 0 auto;
			padding: 1rem;
			max-width: 40rem;
			font-family: system-ui, sans-serif;
			line-height: 1.5;
		}

		section {
			margin-bottom: 2rem;
		}

		.field {
			margin-bottom: 1rem;
		}

		.field label {
			display: block;
		}

		.field input[type="text"],
		.field input[type="number"],
		.field select,
		.field textarea {
			width: 100%;
			max-width: 20rem;
			box-sizing: border-box;
		}

		.check label,
		.check input {
			display: inline;
		}

		.field span[aria-hidden] {
			margin-left: 0.5rem;
		}

		.hint {
			margin: 0.25rem 0 0;
			font-size: 0.9rem;
		}

		fieldset {
			margin-bottom: 1rem;
		}
	</style>
</head>
<body>
	<div id="app"></div>
	<script type="module" src="./settings.js"></script>
</body>
</html>
